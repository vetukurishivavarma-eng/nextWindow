# Local development / single-host deployment.
#   cp .env.example .env   # optional: add VAPID keys for browser push
#   docker compose up --build
# App: http://localhost:8081   (API is proxied at /api)
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nextwindow
      POSTGRES_USER: nextwindow
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-nextwindow}
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nextwindow -d nextwindow"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/nextwindow
      DATABASE_USERNAME: nextwindow
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-nextwindow}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8081}
      CORS_ALLOWED_ORIGINS: ${PUBLIC_URL:-http://localhost:8081}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      FORWARD_HEADERS_STRATEGY: native
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@example.com}
      DEMO_ENABLED: ${DEMO_ENABLED:-true}
      DEMO_SEED_USER: ${DEMO_SEED_USER:-true}
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "${APP_PORT:-8081}:80"
    restart: unless-stopped

volumes:
  db-data:
